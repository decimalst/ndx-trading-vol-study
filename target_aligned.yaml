    analyses,18bootstrap runs, bothHolm families,120ledger events.
  coefficient_relative_tolerance: 1.0e-10
  coefficient_absolute_tolerance: 1.0e-12
  fit_statistic_eps_multiplier: 256
  fit_gradient_eps_multiplier: 512
  marginal_replay_relative_tolerance: 1.0e-10
  marginal_replay_absolute_tolerance: 1.0e-12
  fit_statistic_comparison: Primitive common units, sufficient statistics, unconstrained ratios and objectives
    require finite values, exact zero/sign masks and adaptive256*max(eps*abs(expected),abs(expected)-nextafter(abs(expected),0))
    tolerance. Signed gradient/projected-gradient differences use the fixed512-epsilon/downward-ULP allowance
    summed over their two gradient terms, rather than a relative bound on a cancellation-near-zero gradient.
    Each projected KKT residual must independently satisfy that allowance; no unit absolute floor.
