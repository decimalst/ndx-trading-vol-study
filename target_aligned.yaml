  bootstrap_draws: 99999
  seed: 20260918
  seed_rule: seed+phase_code*10000+block;development0,evaluation1
  inference_scale: 1.0e-10
  normalization: One fixed positive units conversion d/inference_scale for mean/HAC/bootstrap and annual/fixed-slice
    means; restore all dimensional mean/CI/SE/MDE by same scale. No model-dependent weighting.
  arithmetic: Normalized differences, means, centered sum of squares and all bootstrap/HAC/restored results
    finite; a nonconstant normalized series with zero centered sum of squares fails as numerical underflow.
    Exact constant difference allowed.
  p_phase: Maximum two-sided centered-null circular bootstrap p across allblocks and Bartlett HAC126 p
  p_hypothesis: Maximum development and evaluation p
  multiplicity: Holm3 at0.05/(12*13), separately Holm117 at0.05
  gate: Absolute paired product-MSE decrease>=1e-10 bothphases vsALL3controls; negativepaired differences in
    bothfixed evaluation slices; waveHolm<.05/156 andcumulativeHolm<.05
  power: 'Report nominal HAC80percent MDE in original units and divided by fixed effect threshold. Diagnostic
    only: no retrospective effect/sample/power gate, and failure to reject is not equivalence.'
  resolution: Minimum p1/100000 below one tenth strictest raw three-comparison wave cutoff1/9360
  failure_rule: Any admission/arithmetic/replay/fitting/scoring/verification/publication failure retains all3
    new hypotheses UNEVALUABLEp1, available diagnostics and all previous files unchanged.
  limitations: Reused history; noisy daily products and cross fourth moments; shared-mean error; fixed issued
    diagonals enter q. Product-score success does not certify true correlation dynamics, HF covariance or trading
    profit.
verification:
  product_comparison_eps_multiplier: 256
  coherence_eps_multiplier: 64
  dimensionless_relative_tolerance: 1.0e-09
  probability_absolute_tolerance: 1.0e-14
  dimensional_comparison: Adaptive256*max(eps*abs(expected),abs(expected)-nextafter(abs(expected),0)); exact
