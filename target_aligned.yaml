fitting:
  new_models:
  - aligned_constant
  - aligned_dynamic
  cap: 0.995
  training_staging: current_monthly_frozen_fit_training_residuals
  marginals: Apply saved mean coefficients and saved scaled variance coefficients with their saved train_mean
    and original feature transforms; no refit or recalibration. Keep exact issued means/diagonals on scored
    application rows.
  training_rows: Exact original mature paired-label complete-feature mask at each original monthly fit; retain
    every original monthly application, including unscored applications.
  numerical_unit: k=mean(D) where D=sqrt(h_qqq)*sqrt(h_spx); use d=D/k and y=(e_qqq*e_spx)/k for both scalar
    objectives. One common training scalar preserves unweighted original squared loss.
  constant: "a=project_[\u2212c,c](mean(d*y)/mean(d*d)); q0=a*d"
  increment: "phi=tanh(z_corr22); headroom=c-abs(a); w=headroom*d*phi; b=project_[\u22121,1](mean(w*(y-a*d))/mean(w*w));\
    \ hold a fixed"
  prediction: rho0=a; rho1=a+b*headroom*tanh(z_corr22); multiply each by exact issued sqrt(h_qqq)*sqrt(h_spx)
  flat_objective: 'If every constructed w is exactly zero after checking operand arithmetic, use canonical
    b=0 with status FLAT_OBJECTIVE, retain fold and model. This is a prefit amendment to the unregistered prospectus:
    every b is an optimizer of a flat objective. Nonzero w whose squared norm underflows is invalid.'
  optimization_claim: Each stage is a global one-dimensional constrained least-squares minimizer; the staged
    pair is not a jointly optimized two-parameter fit. No penalty, grid or optimizer search.
  minimum_correlation_eigenvalue: 0.005
  new_monthly_fits_expected: 118
  new_scalar_fits_expected: 236
  new_forecasts_expected: 4924
  combined_forecast_rows_expected: 12310
  coefficient_bounds:
    a:
    - -0.995
    - 0.995
    b:
    - -1.0
    - 1.0
  gradient_eps_multiplier: 512
  arithmetic: Finite real inputs/intermediates/results, positive diagonals and common unit, distinguish true
    zeros from nonzero multiplication/square/division underflow; no row deletion, variance weighting or application
    forecast clipping.
  reduction: Every new scalar reduction uses math.fsum(values)/n, including the common unit, sufficient statistics
    and squared objectives. Reject unrepresentable totals or nonzero quotient underflow; frozen feature and
    marginal transforms retain their original algorithms.
