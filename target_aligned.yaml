scoring:
  target: Y=(y_qqq-issued_mu_qqq)*(y_spx-issued_mu_spx)
  forecast: q=issued_rho*(sqrt(issued_h_qqq)*sqrt(issued_h_spx)); geometric mean first
  loss: (Y-q)^2, finite nonnegative, with signed and zero Y/q valid
  paired_difference: (q_candidate-q_control)*((q_candidate-Y)+(q_control-Y)) after separately validating both
    individual squared losses
  units: Decimal raw intraday log returns; product has squared-return units and MSE has fourth-power-return
    units
  effect_threshold_absolute: 1.0e-10
  effect_reference: '(0.01*0.001)^2: squared cross-moment error of a1percent by10basispoint reference return
    pair; fixed exante reference scale, not measured profitability or forecast-RMSE reduction'
  new_model_fits: 236
  common_sample: All original three-model rows retained exactly, plus both new models for every original scored
    origin; exact shared labels/means/timing and conditional diagonals. No target/loss selection.
  conditional_rho_max: 0.995
  constant_matrix_rho_max: 0.999999
  arithmetic: Reject all nonfinite intermediates/results and nonzero-input products/squares underflowing to
    zero. Exact zeros are valid. Individual MSE must remain finite even when paired predictions are equal.
    Separate roots before geometric mean avoid variance-product overflow.
  coherence_eps_multiplier: 64
  coherence_rule: abs(factored_difference-(candidate_mse-control_mse)) <=sum64*max(eps*abs(term),abs(term)-nextafter(abs(term),0))
    over candidate_mse/control_mse/factored_difference; finite bound, no unit-dependent absolute floor
  auxiliary_matrix_loss: For new rows recompute the original matrix loss solely as a validity field; no matrix-score
    hypothesis, comparison or promotion analysis in this wave.
