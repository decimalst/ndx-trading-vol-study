  shared_moments: staged mean and variance models include rawSKEW and curvature; freeze their fitted functions for both density forecasts
  standardized_skew: raw lagged SKEW centered/scaled on exact admitted training rows
  constant: lambda=0.95*tanh(a)
  candidate: lambda=0.95*tanh(a+b*standardized_skew)
  coefficient_bounds: [-3.0, 3.0]
  slope_penalty: 0.01
  objective: mean negative standardized innovation logdensity plus0.01*b^2; intercept unpenalized; common external logscale term omitted during shape optimization
  starts: constant a=0; candidate a=fittedconstant_a,b=0
  optimizer: scipy L-BFGS-B with analytic lambda chain-rule gradient
  maximum_iterations: 1000
  maximum_line_search: 50
  ftol: 0.00000000000001
  gtol: 0.000000001
  projected_gradient_tolerance: 0.0000001
  acceptance: optimizer success plus finite in-bound parameters/objective and projectedgradient<=1e-7; no retry fallback multistart or clipping
  probability: CDF((-1.5-shared_mu)/sqrt(shared_variance),nu8,lambda)
  log_density: logpdf((u-shared_mu)/sqrt(shared_variance),nu8,lambda)-0.5log(shared_variance)
