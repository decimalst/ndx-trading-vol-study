source_contract:
  admission: Reconstruct complete original wave14 VERIFIED record and separately complete wave8 VERIFIED record
    through frozen read-only functions; historical inventories anchored by original manifest hashes, never expanded-current-tree
    old coverage
  immutable_read: Read and hash each admitted parquet/JSON input once before decoding; inherited metrics and ledgers
    use same checked snapshots. For old wave8 raw reconstruction stage all its registered input bytes into a temporary
    same-relative-path tree, normalize only documentary source_path prefixes back to originalroot, and preserve
    old parser/gates
  sources:
    daily: data/research_paths/spx_daily.parquet
    vix: data/free_sources/raw/cboe/VIX_History.csv
    vix9d: data/free_sources/raw/cboe/VIX9D_History.csv
    vvix: data/free_sources/raw/cboe/VVIX_History.csv
    cpi: data/source_discovery/macro_plans/cpi/ledger.json
    nfp: data/source_discovery/macro_plans/nfp/ledger_verified.json
    fomc: data/source_discovery/macro_plans/calendar/fomc_original_annual_plans.csv
    fomc_coverage: data/source_discovery/macro_plans/calendar/fomc_annual_coverage.json
  calendar:
    source_publication_start: '2010-01-01'
    source_publication_end: '2025-10-20'
    bls_policy: next plan printed in preceding monthly release; original planned dates retained even if later canceled
      or changed
    bls_revision_policy: current archives with explicit this-release reissue notices remain unadmitted for both
      CPI and payroll; retain original source ledger and separate pre-fit admission correction
    source_eligibility: publication civil date strictly before preceding observed market-session date
    nominal_start: entry civil date1600America/New_York
    nominal_end: next Monday-through-Friday civil date1600America/New_York; skip weekends only
    duration: nominal endpoint UTC difference in hours; includes DST elapsed-time change
    cpi: eligible original CPI planned timestamp falls in open-left closed-right nominal window
    nfp: eligible original payroll planned timestamp falls in open-left closed-right nominal window
    fomc: eligible original annual meeting final DATE equals nominal ending date; date-only timing control, no invented
      statement time
    fomc_annual: exactly8original planned meetings per year from selected full annual announcement published before
      covered year
    coverage: each nominal-window calendar month requires its eligible explicit original BLS plan; full eligible
      annual FOMC plan required
    missing: pending retrieval blocks execution; intrinsically absent or ambiguous source statements remain unknown
      and enter all-arm complete-sample mask; no date/year inference or zero fill
    limitations: nominal window ignores holidays and early closes; neither actual nor historically planned exchange
      holding interval; no actual next market date enters a predictor
    provenance: exact currently captured official-document tool text and extraction hashes; raw provider bytes and
      immutable historical web vintages unverified
    replication: Legacy repository calendars already forecast next-session variance; this tests original-plan admission
      with stronger matched SPX controls, not a first calendar mechanism
  measurement: Exact frozen wave8 daily SPX target/market transformations; max(GK,1e-10) is part of that preexisting
    risk proxy, not the later strict paired-asset raw-GK gate
  missing: Keep full bounded SPX reference calendar, strict old rolling history and exact original-plan known-month
    masks; no zero filling, removed macro controls, holiday repair or next-common-date labels
  limitations: Reused Yahoo/Cboe archival values, unverified historical publication latency and revisions, original-plan
    documentary coverage, nominal civil windows and early back-calculated VIX9D persist; no source acquisition or
    institutional mechanism claim
target:
  formula: max(Garman-Klass[next],1e-10)+log(raw_open[next]/raw_close[entry])^2
  availability: Next actual observed SPX close, target_end=available_date; strictly positive finite known risk labels;
    missing stays unknown
  interpretation: Native squared-log-return daily OHLC full-session risk proxy, not measured high-frequency integrated
    variance
  cohort: All32complete predictors and exact common mature labels across everymodel; monthly firstfeaturecomplete
    application before futurequerylabelmask; no event-only evaluation or dropped unscored month
