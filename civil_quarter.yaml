fitting:
  penalty: 0.01
  old_scale_minimum: 1.0e-12
  new_civil_scale: 1.0
  baseline: 31-column normalized mean eta+exp(log(q/meanq)-eta) plus.01squaredslopes; unpenalizedintercept, old17populationmean/std,
    new13fixedscale1center
  normalization: Trainmean=arithmetic mean of positivey; qscaled=y/trainmean; nativeforecast exp(log(trainmean)+design@scaled_beta)
  quarter: "Freeze baselineeta; z=G5-trainmeanG5; fitonly b via mean(eta0+bz+exp(logqscaled-eta0-bz))+.01b\xB2;\
    \ no extra intercept or jointrefit"
  mean: Exact arithmetic training mean on sameall32featurecomplete mature rows
  optimizer: Deterministic Newton from allzero baselinecoefficients and quarterb0; atmost200states and60Armijo halvings
    perstep, armijo1e-4; accepted fullgradientmax<=1e-8
  maximum_iterations: 200
  maximum_backtracks: 60
  armijo: 0.0001
  gradient_tolerance: 1.0e-08
  scalar_bracket: R=max(1,abs(initial_scalar_gradient)/.02); audit finite gradients at -R,+R enclosing zero; unique
    optimum follows curvature>=.02
  arithmetic: Strictrealfinite designs/parameters/states/predictions; positivey/mean/scaledtargets/ratio/forecast;
    reject unsupported nonzeroproduct,quotient,exp underflow. Tentative invalid objectives may be rejected within
    the fixed Armijo schedule; accepted iterates and published forecasts cannot be repaired/clipped/restarted
scoring:
  loss: proper_variance
  formula: log(h)+y/h
  effect_threshold_absolute: 0.005
  paired_difference: d=(hA-hB)/max(hA,hB); gap=logratio-d*(y/min(hA,hB)). For abs(d)<=.5 logratio=-log1p(-d) ifd>=0
    else log1p(d); otherwise log(hA)-log(hB)
  arithmetic: First validate every positive real input and finite individual score, reject unsupported quotient/product
    underflow. Coherence allowance64 times sum of unit(x) for loghA,y/hA,loghB,y/hB,stablegap,directgap; unit=max(eps*abs(x),abs(x)-nextafter(abs(x),0)),
    no unit floor
  effect_reference: Absolute mean natural-log proper-score decrease.005 bothphases, not percentage of potentiallynegative
    rawscore or profit
