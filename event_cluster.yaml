  - expected_adjacency22
  - linear_recency22
  nuisance_formula:
  - N/22
  - N*N/484
  - last_event
  - (N-last_event)*(N-1)/441
  - sum((2*i-23)*e_i for i=1..22)/462
  candidate: adjacency_fraction22
  candidate_formula: C/21; C=sum(e_i*e_(i-1) for i=2..22)
  diagnostic: excess_adjacency22=(21*C-(N-last_event)*(N-1))/441; never enters fit or promotion
  arithmetic: exact Python integer numerators followed by single fixed division; N*N/484 is not square
    of rounded N/22
  centering: training-only math.fsum/n; exactconstant uses firstvalue; fixedscale1 and no rank/column
    deletion
models:
- baseline
- recent_frequency
- nuisance
- cluster
model:
  baseline: original wave18 saved26-coefficient monthly fit; no refitting; original issuedquery probabilities
    strictlyreplayed and retained
  training_offset: apply that same savedmonthlyfit to its original maturetrainingrows; in-sample currentfit
    offsets, not historicalissuances
  nuisance: mean Bernoulli NLL with frozenbaselineoffset +freeintercept +five centeredboundedslopes, .01sum(slope^2)
  candidate: mean Bernoulli NLL with frozennuisanceoffset +one centeredC/21 slope, .01coefficient^2; no
    newintercept
  ridge: 0.01
  producer_nuisance:
    method: frozen sign_memory_models._newton
    start: six literalzeros
    maxiter: 200
    max_backtracks: 60
    armijo: 0.0001
    gradient_tolerance: 1.0e-08
  producer_scalar:
    method: brentq
    bracket: +/- (mean(abs(centered_candidate))+1)/.02
    xtol: 1.0e-12
    rtol: 1.0e-14
    maxiter: 200
    gradient_tolerance: 1.0e-08
  constant: center exactconstants exactly; constantnuisances retainzerocoefficients; constantadjacency
    retainsscalarzero and nuisanceprobability
  probability: copy checkedparent probability when addedquerycorrection exactlyzero; otherwise expit(parentlogit+correction);
    no clipping
  scalar_arithmetic: finitefloat64; signedsoftplus and signedresidual remain nonzero for finite logits;
    checked nonzero products rejectunderflow; compensated scalar reductions
  nuisance_arithmetic: frozen logistic_state numerical contract; finite objective, fullgradient and Hessian;
    no optional unusedcurvature admission gate
  fallback: none; no empiricalrepair or tolerance change
