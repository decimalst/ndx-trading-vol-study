protocol_version: 1
frozen_on: "2026-08-12"
status: "acquisition_only_no_download"

storage:
  raw_root: "data/free_sources/raw"
  processed_root: "data/free_sources/processed"
  manifest_suffix: ".manifest.json"
  minimum_free_reserve_bytes: 5368709120
  download_safety_multiplier: 2.0

policies:
  raw_commit_policy: "local_only_never_commit"
  manifest_policy: "sha256_size_and_source_identity_required"
  overwrite_policy: "refuse_unmanifested_or_hash_mismatched_existing_files"
  dynamic_source_policy: "record_retrieval_timestamp_and_observed_hash; never trust an earlier hash"
  provenance_policy: "unidentified or conflicting upstream rights remain private-research-only"
  no_download_during_protocol_construction: true

availability:
  cftc_tff:
    rule: "report_date_plus_7_calendar_days"
    days: 7
    rationale: "Tuesday positions are normally released Friday; seven calendar days is a conservative fail-closed research timestamp."
  cboe_daily:
    rule: "next_declared_exchange_session"
    sessions: 1
    rationale: "A daily close may first enter a model at the following declared exchange session."

