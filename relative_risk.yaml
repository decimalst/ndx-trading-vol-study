  - entry_dow_4
  baseline_description: For each asset log strict1/5/22mean intraday GK and total GK-plus-raw-overnight risk, strict1/5/22mean
    max(-raw close logreturn,0); lagged logVXN/logVIX/log(VIX9D/VIX)/logVVIX and entryweekday
  market_lag: 1
  target: log(GK_QQQ[next observed SPX session])-log(GK_SPX[next observed SPX session]); same-date QQQ observation required
  target_interpretation: Conditional mean of log intraday OHLC-risk ratio under MSE; not ratio of expected variances, covariance
    or hedged portfolio variance
  label_availability: Both same-date intraday OHLC observations mature at actual next observed SPX close
  minimum_train: 1000
  common_sample: All3models share all28 complete features and finite mature signed targets; zero log ratios retained
  fit_schedule: Monthly first feature-complete origin before future query-label filtering; expanding training with label available
    by previous SPX session
  objective: mean squared error plus0.01 times squared standardized slopes; unpenalized intercept; no target-standard-deviation
    normalization
  feature_scaling: Training-only population mean/std; any27nonintercept scale<=1e-12 or nonfinite aborts entire wave
  penalty: 0.01
  effect_rationale: fixed before new outcomes; at least0.25percent reduction in positive control MSE for the signed log-risk difference
  all_features:
  - const
  - qqq_lg_d
  - qqq_lg_w
  - qqq_lg_m
  - qqq_lt_d
  - qqq_lt_w
  - qqq_lt_m
  - qqq_neg_d
  - qqq_neg_w
  - qqq_neg_m
  - spx_lg_d
  - spx_lg_w
  - spx_lg_m
  - spx_lt_d
  - spx_lt_w
  - spx_lt_m
  - spx_neg_d
  - spx_neg_w
  - spx_neg_m
  - lvxn
  - lvix
  - term
  - lvvix
  - entry_dow_1
  - entry_dow_2
  - entry_dow_3
  - entry_dow_4
  - corr22
  solver: Direct normalized ridge linear solve with centered training target; full mean-MSE gradient including intercept checked<=1e-10;
    no fallback
  effect_threshold_relative: 0.0025
measurement:
  gk_floor: 1.0e-10
  formula: 0.5*log(high/low)^2-(2*log(2)-1)*log(close/open)^2
  admission_pool: For each asset separately, every observed complete OHLC row after alignment to full bounded SPX reference
    calendar; before ANY correlation, feature, target or sample mask
  gate: Every observed raw GK must be finite and strictly greater than1e-10; equality activates the gate; any finite floor
    activation makes whole wave INSUFFICIENT_MEASUREMENT
  failure: Save measurement audit before requiring PASS; no feature/target construction or fits on floor failure; retain both
    registered hypotheses as UNEVALUABLEp1
  missing: Absent or partially missing OHLC is counted separately and remains unknown; never converted to zero or floored
  invalid: Nonpositive or infinite observed prices, inconsistent complete OHLC range, or nonfinite computed GK raises invalid-run
    failure for whole wave
  zero_target: Zero or negative log-risk differences are valid; gate applies to each underlying risk, not sign of target
  diagnostics: Per-asset observed/missing/finite counts, nonpositive raw GK count, small positive raw GK<=floor count, total
    floor hits and minimum raw GK; no selective deletion or replacement
  claims: No integrated-variance, causal, cash-profit, portfolio variance or exact Nasdaq100-index claim
comparisons:
  new_hypotheses: 2
  inherited_hypotheses: 108
  cumulative_hypotheses: 110
  inherited_sources:
  - reports/orthogonal_round2/metrics.json
  - reports/model_memory_study/combined_metrics.json
  - reports/iterative_signal_search/metrics.json
  - reports/international_volatility/metrics.json
  - reports/overnight_index/metrics.json
  - reports/macro_overnight/metrics.json
  - reports/measurement_memory/metrics.json
  - reports/index_hinge/metrics.json
  - reports/tail_shape/metrics.json
  - reports/calendar_variance/metrics.json
  controls:
  - baseline
  - mean
  candidate_gate: One joint-correlation addition must beat both controls; no ratio reparameterization or separate component
    forecast arm
  contrasts:
  - - correlation
    - baseline
    - mse
  - - correlation
    - mean
    - mse
inference:
  loss: Squared error of signed log intraday OHLC-risk difference
  blocks:
  - 21
  - 63
  - 126
  block_units: consecutive retained paired-forecast observations in chronological order; missing calendar dates are reported
    and not imputed
  bootstrap_draws: 99999
  seed: 20260915
  seed_rule: seed+phase_code*10000+block;development0,evaluation1
  p_phase: maximum two-sided centered-null circular bootstrap p across allblocks and Bartlett HAC126 p
  p_hypothesis: maximum development/evaluation p
  multiplicity: Holm2 at0.05/(9*10), separately Holm110 at0.05
  gate: At least0.25percent relative MSE improvement in both phases against BOTHcontrols, negative paired MSE gaps in both
    fixed evaluation slices, waveHolm<0.05/90 andcumulativeHolm<0.05
  reporting: All2 absolute MSE differences and relative gains, uncertainty envelopes, nominal MDE, annual and fixed-period
    diagnostics; control MSE must be strictly positive
  failure_rule: Any registered measurement, fit, scoring, verification or output failure retains both hypotheses as UNEVALUABLEp1;
    no post-result tuning repair or omitted arms
  caveat: Dependence-aware corrections cannot reverse reused-history selection, ETF/index measurement differences or archival
    source uncertainty
  hac_lags: 126
  minimum_phase_observations: 127
  resolution: 1/100000 is below one tenth of strictest waveHolm cutoff1/3600
outputs:
  data: data/relative_risk
  reports: reports/relative_risk
source_contract:
  instruments: QQQ ETF vendor raw OHLC and Yahoo ^GSPC SPX price index; no audited exact Nasdaq100 OHLC source is claimed
  fields: open,high,low,close only; no adjusted close, volume, inferred distributions or corporate-action substitution
  reference_calendar: Retain every bounded observed SPX date; reindex QQQ without first intersecting calendars; no next-common-date
    labels
  previous_close: Each asset raw overnight and close return requires its actual source predecessor date equal to preceding
    SPX reference date; otherwise unknown
  vintage: Archival Yahoo and Cboe extracts; revisions, synchronized auctions and exact historical publication latency unverified
  vix9d: Back-calculated January2011-October2013 training history; forecasts begin2016
  iv_match: VXN proxies QQQ underlying Nasdaq100 IV; VIX/VIX9D concern SPX and VVIX concerns VIX; not an implied relative
    variance premium
  missing: Missing observed quotes or absent exact-date sources remain unknown through strict rolling windows; no filling
    or compressed rolling
  limitations: Intraday ratios cancel common within-session units, but ETF tracking, index construction and vendor conventions
    remain; raw intersession controls retain distribution effects
verification:
  coefficient_relative_tolerance: 1.0e-07
  coefficient_absolute_tolerance: 1.0e-12
  forecast_relative_tolerance: 1.0e-08
  forecast_absolute_tolerance: 1.0e-12
  gradient_tolerance: 1.0e-10
  independent_fit: Separate augmented least-squares ridge and KKT, independently reconstructed measurement gate, full source
    calendar, predictors, targets, fit rows, forecasts, scores and accounting
  identity_test: With identical rows, regressors, scaling and penalty, ridge(component log risk difference) equals difference
    of component ridge forecasts; this is not an extra signal arm
correlation:
  window: 22
  returns: raw log(close/open) per matched SPX date, common within-session units cancel
  calculation: Centered two-pass Pearson covariance divided by centered norms over exactly22 complete paired returns; ends
    at previous SPX session
  missing: Any missing pair in window or exact zero centered denominator makes correlation unknown for all models
  roundoff_tolerance: 1.0e-12
  bounds: Retain finite rho including tiny overshoot with abs(rho)<=1+1e-12; reject larger violation; no clipping, epsilon
    denominator, alternate window or Fisher transform
