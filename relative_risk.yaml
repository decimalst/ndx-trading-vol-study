  - '2020-01-02'
  - '2025-10-17'
  evaluation_stability:
  - - '2020-01-02'
    - '2022-12-31'
  - - '2023-01-01'
    - '2025-10-17'
  horizons:
  - 1
  models:
  - mean
  - baseline
  - correlation
  baseline:
  - const
  - qqq_lg_d
  - qqq_lg_w
  - qqq_lg_m
