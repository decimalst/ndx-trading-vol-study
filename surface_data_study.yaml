# Frozen before any normalized surface aggregate or predictive result was read.
# The raw mirrors have uncertain upstream redistribution rights; this is a
# private, diagnostic research protocol and never changes the sealed NDX clean
# experiment.
protocol_version: 1
specified_on: "2026-08-12"
status: frozen_before_first_empirical_run
evidence_class: private_diagnostic_only
decision_time: "16:00 America/New_York"
no_tuning_after_results: true

provenance:
  raw_redistribution: forbidden
  commit_raw_data: forbidden
  publish_reconstructive_outputs: forbidden
  source_license_labels_are_not_verified_upstream_rights: true
  permitted_outputs: [source_manifest, daily_shape_aggregates, forecasts, aggregate_metrics]
  disclaimer: >
    Kaggle license labels are uploader metadata, not proof that the uploader
    could relicense exchange-derived market data. Raw files remain private.

sources:
  session_calendar:
    path: data/history_extension/qqq_price_only_daily.parquet
    rule: exact_dates_present_in_locked_qqq_daily_panel
  qqq:
    kaggle_slug: kylegraupe/qqq-daily-option-chains-q1-2020-to-q4-2022
    kaggle_version: 1
    raw_dir: data/free_sources/raw/kaggle/qqq
    members: [qqq_2020_2022.csv]
    advertised_coverage: ["2020-01-01", "2022-12-31"]
    validated_coverage: ["2021-01-04", "2022-12-30"]
    expected_rows: 1775749
    kaggle_license_label: "CC0: Public Domain"
    provenance: undisclosed
  spy:
    kaggle_slug: dudesurfin/spy-options-eod-volatility-surface-2010-2023
    kaggle_version: 2
    raw_dir: data/free_sources/raw/kaggle/spy
    members:
      - spy_eod_2010.parquet
      - spy_eod_2011.parquet
      - spy_eod_2012.parquet
      - spy_eod_2013.parquet
      - spy_eod_2014.parquet
      - spy_eod_2015.parquet
      - spy_eod_2016.parquet
      - spy_eod_2017.parquet
      - spy_eod_2018.parquet
      - spy_eod_2019.parquet
      - spy_eod_2020.parquet
      - spy_eod_2021.parquet
      - spy_eod_2022.parquet
      - spy_eod_2023.parquet
    validated_coverage: ["2010-01-04", "2023-12-29"]
    kaggle_license_label: MIT
    provenance: "Uploader says raw data came from OptionsDX and was converted to Parquet"
  aapl:
    kaggle_slug: kylegraupe/aapl-options-data-2016-2020
    kaggle_version: 4
    raw_dir: data/free_sources/raw/kaggle/aapl
    members: [aapl_2016_2020.csv, aapl_2021_2023.csv]
    validated_coverage: ["2016-01-04", "2023-03-31"]
    expected_rows: 1563515
    kaggle_license_label: "CC0: Public Domain"
    provenance: undisclosed

parser_contract:
  strip_utf8_bom: true
  strip_square_brackets_and_whitespace: true
  required_columns:
    - QUOTE_UNIXTIME
    - QUOTE_READTIME
    - QUOTE_DATE
    - QUOTE_TIME_HOURS
    - UNDERLYING_LAST
    - EXPIRE_DATE
    - EXPIRE_UNIX
    - DTE
    - C_DELTA
    - C_GAMMA
    - C_IV
    - C_VOLUME
    - C_BID
    - C_ASK
    - STRIKE
    - P_BID
    - P_ASK
    - P_DELTA
    - P_GAMMA
    - P_IV
    - P_VOLUME
  quote_time_hours: 16.0
  require_readtime_local_hhmm: "16:00"
  reject_dates_not_in_exact_session_calendar: true
  require_positive_underlying_and_strike: true
  dte_min: 1.0
  dte_max: 90.0
  require_finite_bid_ask: true
  require_nonnegative_bid_ask: true
  require_noncrossed_bid_ask: true
  require_positive_iv: true
  duplicate_contract_rows: reject

shape_construction:
  maturity_selection:
    nine_day:
      target_dte: 9.0
      permitted_dte: [5.0, 14.0]
    thirty_day:
      target_dte: 30.0
      permitted_dte: [21.0, 45.0]
    tie_break: lower_dte_then_expiry
  delta_match:
    atm_call: 0.50
    atm_put: -0.50
    wing_call: 0.25
    wing_put: -0.25
    maximum_absolute_error: 0.10
    tie_break: absolute_delta_error_then_strike
  measures:
    atm_iv_30: mean_of_matched_30d_call_and_put_iv
    skew_25d: matched_30d_put_iv_minus_call_iv
    term_9d_30d: matched_9d_atm_iv_minus_matched_30d_atm_iv
    gamma_weighted_volume: sum_abs_gamma_times_reported_volume_across_valid_call_and_put_sides
  gamma_weighted_volume_is_not_dealer_gex: yes
  open_interest_available: false
  no_interpolation_or_parameter_search: true

timing:
  rule: >
    A surface measured at session t's 16:00 snapshot is assigned only to the
    next exact exchange session t+1 origin. The next-day RV target is session
    t+2. Thus every surface input is lagged by one full exchange session.
  origin_price_information: close_and_close_to_close_rv_through_origin_t
  surface_measurement_lag_sessions: 1
  target_horizon_sessions: 1
  require_strictly_ordered_measurement_origin_target: true

study:
  target: squared_close_to_close_log_return
  log_floor: 1.0e-12
  min_training_rows: 252
  baseline_features: [lrv_d, lrv_w, lrv_m, log_atm_iv_30]
  augmented_features:
    - lrv_d
    - lrv_w
    - lrv_m
    - log_atm_iv_30
    - skew_25d
    - term_9d_30d
    - log1p_gamma_weighted_volume
  estimator: expanding_ols_with_log_smearing
  refit: every_origin
  primary_loss: qlike
  comparison: augmented_minus_baseline_on_identical_rows
  tail:
    event: next_day_rv_exceeds_expanding_training_90th_percentile
    quantile: 0.90
    score: forecast_variance
    metrics: [auc, top_decile_lift, top_decile_event_rate, base_rate]
    top_fraction: 0.10
  inference:
    moving_block_sessions: 22
    bootstrap_draws: 5000
    seed: 81173
    confidence_level: 0.95
  spy:
    role: external_primary_diagnostic
    early: ["2011-01-03", "2016-12-30"]
    late_confirmation: ["2017-01-03", "2023-12-29"]
    governing_split: late_confirmation
    verdict_rule: >
      IMPROVES only if late mean paired QLIKE difference is negative and its
      moving-block 95% interval is wholly below zero; WORSE symmetrically;
      otherwise INCONCLUSIVE.
  qqq:
    role: mechanism_diagnostic_only
    score_all_eligible_rows: true
  aapl:
    role: mechanism_diagnostic_only
    score_all_eligible_rows: true
    split_audit:
      event: "2020-08-31 four-for-one split"
      pre_session: "2020-08-28"
      post_session: "2020-08-31"
      expected_pre_over_post_range: [3.5, 4.5]
      forecast_handling: >
        Do not rewrite source prices. Mark both close-to-close returns crossing
        the split boundary missing; full-window HAR rolling then withholds the
        following 22-session window automatically.
    earnings_overlay: omitted
    earnings_omission_reason: >
      Existing historical labels lack a frozen point-in-time publication
      timestamp proving that each announcement date/session was knowable at
      the forecast origin.

outputs:
  processed_dir: data/free_sources/processed
  daily_surface: data/free_sources/processed/daily_surface.parquet
  source_manifest: data/free_sources/processed/source_manifest.json
  forecasts: data/free_sources/processed/surface_study_forecasts.parquet
  metrics: data/free_sources/processed/surface_study_metrics.json
  report: reports/surface_data_study.md
