name: tests

# The point of this workflow is that the guards actually run. Two of the
# repository's worst defects were guards that existed but were never executed:
# a methodology fork whose own suite failed 12 of 28 tests on a clean checkout,
# and a test-discovery setup that collected 0 tests and reported success.
#
# So this job asserts a MINIMUM TEST COUNT. A green run that executed nothing is
# treated as a failure, which is the whole lesson.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Frozen pre-registered reports match their pinned digests
        # Runs first and on its own: this is the one check that is not
        # self-healing, and it needs no data beyond what is committed.
        run: |
          python -m unittest \
            tests.test_methodology.TestFrozenReportsUnchanged.test_frozen_reports_match_their_pinned_digests

      - name: Run the full suite
        run: python -m unittest discover -s tests -t . -v 2>&1 | tee /tmp/test.log

      - name: Assert the suite actually executed
        # `unittest discover` silently collects 0 tests when packaging is wrong
        # and still exits 0. Without this step a broken checkout looks green.
        run: |
          set -euo pipefail
          ran=$(grep -oE '^Ran [0-9]+ tests?' /tmp/test.log | grep -oE '[0-9]+' | tail -1)
          echo "collected: ${ran:-0} tests"
          if [ "${ran:-0}" -lt 300 ]; then
            echo "::error::Only ${ran:-0} tests ran; expected >= 300. A suite that"
            echo "::error::collects nothing must fail, not pass."
            exit 1
          fi

      - name: Report which tests skipped, and why
        # Several assertions skip when the processed data is absent. That is
        # correct behaviour on a fresh checkout, but a skip is not a pass and
        # must be visible rather than silent.
        if: always()
        run: |
          skipped=$(grep -cE "\.\.\. skipped" /tmp/test.log || true)
          echo "### Skipped: ${skipped:-0}" >> "$GITHUB_STEP_SUMMARY"
          grep -E "\.\.\. skipped" /tmp/test.log >> "$GITHUB_STEP_SUMMARY" || true
