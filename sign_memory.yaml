measurement:
  gk_floor: 1.0e-10
  formula: 0.5*log(high/low)^2-(2*log(2)-1)*log(close/open)^2
  admission_pool: For each asset separately, every observed complete OHLC row after alignment to full bounded SPX
    reference calendar; before ANY correlation, feature, target or sample mask
  gate: Every complete observed raw GK strictly greater than1e-10; every observed open/close pair must yield finite
    signed log(close/open), including high/low gaps. Audit precedes any feature/target/sample mask.
  failure: Save measurement audit before requiring PASS; no feature/target construction or fits on floor failure;
    retain both registered hypotheses as UNEVALUABLEp1
  missing: Absent or partially missing OHLC is counted separately and remains unknown; never converted to zero or
    floored
  invalid: Invalid observed prices/ranges or nonfinite computed GK fail wholewave. Any observed open/close pair
    producing nonfinite signed log return fails even when high/low is missing; missing open/close stays unknown.
  zero_target: Any exact zero raw intraday return is retained as strict nonagreement; any missing pair remains unknown
  diagnostics: Full inherited GK/signed return gate before any feature/target mask; binary counts only after pretests
    and registration
  claims: No standalone index direction, volatility magnitude, covariance, copula identification or profit claim
source_contract:
  instruments: QQQ ETF vendor raw OHLC and Yahoo ^GSPC SPX price index; no audited exact Nasdaq100 OHLC source is
    claimed
  fields: open,high,low,close only; no adjusted close, volume, inferred distributions or corporate-action substitution
  reference_calendar: Retain every bounded observed SPX date; reindex QQQ without first intersecting calendars;
    no next-common-date labels
  previous_close: Each asset raw overnight and close return requires its actual source predecessor date equal to
    preceding SPX reference date; otherwise unknown
  vintage: Archival Yahoo and Cboe extracts; revisions, synchronized auctions and exact historical publication latency
    unverified
  vix9d: Back-calculated January2011-October2013 training history; forecasts begin2016
  iv_match: VXN underlying Nasdaq100 and SPX/VIX controls; no implied covariance or exact synchronous index/ETF
    auction data claimed
  missing: Missing observed quotes or absent exact-date sources remain unknown through strict rolling windows; no
    filling or compressed rolling
  limitations: Intraday ratios cancel common within-session units, but ETF tracking, index construction and vendor
    conventions remain; raw intersession controls retain distribution effects
  immutable_read: Copy each six declared raw file and its documentary manifest from a single hash-checked byte snapshot
    into an isolated temporary directory at same relative path; frozen loader bounds dates before numerical parsing;
    source audits retain original registered path/hash; no source writes
correlation:
  window: 22
  returns: raw log(close/open) per matched SPX date, common within-session units cancel
  calculation: Centered two-pass Pearson covariance divided by centered norms over exactly22 complete paired returns;
    ends at previous SPX session
  missing: Any missing pair in window or exact zero centered denominator makes correlation unknown for all models
  roundoff_tolerance: 1.0e-12
  bounds: Retain finite rho including tiny overshoot with abs(rho)<=1+1e-12; reject larger violation; no clipping,
    epsilon denominator, alternate window or Fisher transform
