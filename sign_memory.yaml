wave: 13
wave_alpha: 0.0002747252747252747
objective: Test one lagged excess directional-agreement memory increment for QQQ ETF and SPX price index
evidence_class: exploratory_reused_history_archival_QQQ_SPX_raw_sign_agreement
upstream:
  protocol: target_aligned.yaml
  reports: reports/target_aligned
  data: data/target_aligned
  protocol_sha256: ca11ec1c90f8d83867b6dce4efaaac4f0e5ed11e23143e2ab1f28d78a9f136b3
  manifest_sha256: 996e9f8f081a69a66dad9c4c611feb6775fc69c5ad9e3630230d55ad97b426d9
  verification_sha256: dfdc8224a8b7455622e6a16e2671bc70fe01a9a2600e78f39814ad824510fbd0
  verifier_sha256: 93e8ac7f88624fec0933600a85062397c9b0b2306afe87d0b4e3ee4af0f751d2
  required_status: VERIFIED
  admission: Reconstruct original VERIFIED record via frozen read-only functions; all prior pins and full outputs
    included in new manifest; historical inventory anchored by original manifest hash, not current-tree old coverage
target:
  event: Both next observed SPX-session raw log(close/open) returns strictly positive, or both strictly negative
  zero: Either or both exactly zero gives class0; complement includes opposite directions and ties
  missing: Any missing return gives unknown, never class0; reject infinity or invalid observed source
  sign_arithmetic: Direct comparisons, never multiplication of returns or epsilon sign threshold
  positive_rescaling: Within-session positive price unit changes preserve each raw return; no total-return or executable
    auction equivalence
  fit_schedule: Monthly first feature-complete origin before future query-label filtering; expanding training labels
    mature by prior SPX close; retain unscored applications and folds
features:
  window: 22
  bounded:
  - qqq_pos22
  - qqq_neg22
  - spx_pos22
  - spx_neg22
  - independent22
  memory: excess22
  formula: independent22=P_Q+*P_S+ + P_Q-*P_S-; excess22=joint_strict_agreement22-independent22
  history: All five component fractions require identical complete paired 22-session window ending t-1 on full SPX
    calendar; no compressed dates or filling
  interpretation: Empirical excess agreement memory beyond marginal signs; not an unbiased dependence estimator
    or copula parameter
fitting:
  penalty: 0.01
  maximum_iterations: 200
  maximum_backtracks: 60
  armijo: 0.0001
  gradient_tolerance: 1.0e-08
  scale_minimum: 1.0e-12
  baseline: Unpenalized intercept and normalized logistic NLL plus .01 squared slopes; original33nonintercept+training-centered
    corr22 square population standardized, five bounded controls centered with fixedscale1
  memory: "Freeze baseline logit; add b*(excess22-training_mean) with .01*b\xB2, no intercept or joint augmented\
    \ refit"
  constant_bounded: Predeclared exact all-equal test centers column exactly to zero, retains column with canonical
    penalized coefficient zero; fixedscale1
  constant_memory: Predeclared exact all-equal excess22 yields centered memory zero and canonical b0 with retained
    model/fold
  frequency: Mean binary training label on exact same complete mature sample
  arithmetic: Finite real inputs, logits, derivatives, objectives, coefficients and probabilities; stable logaddexp/expit;
    numeric probability endpoints allowed; no posthoc probability clipping or optimizer fallback
  optimizer: Deterministic damped Newton with positive Hessian and Armijo from fixed initialization; audit objective/fullgradient
    and independent stationary convex optimum before interpretation
  optimization_claim: Each stage convex with unique slope optimum due positive ridge; staged pair is not the jointly
    optimized augmented model
  initialization: Baseline intercept logit(training frequency), all slopes0; memoryb0; no restarts
  stable_logistic: NLL mean(logaddexp(0,(1-2y)*eta)); score expit(eta) fory0 and -expit(-eta) fory1; curvature expit(eta)*expit(-eta)
scoring:
  loss: brier
  effect_threshold_absolute: 0.0005
  paired_difference: (p_candidate-p_control)*((p_candidate-y)+(p_control-y)), after finite individual squared loss
    validation
  arithmetic: Binary finite y and finite probabilities in[0,1]; loss in[0,1]; exactzero errors valid; nonzero squares/products
    underflowing tozero reject; coherence64epsilon/downwardULP no arbitrary absolute floor
  functional: Conditional strict-agreement probability; expected Brier pi(1-pi)+(p-pi)^2; bounded loss needs no
    return fourth moments
  effect_reference: Absolute squared-probability error decrease .0005 bothphases; fixed statistical reference, not
    profit or direct probability-point improvement
comparisons:
  new_hypotheses: 2
  inherited_hypotheses: 117
  cumulative_hypotheses: 119
  inherited_sources:
