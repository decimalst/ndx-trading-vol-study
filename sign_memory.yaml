  - reports/cross_moment/metrics.json
  - reports/target_aligned/metrics.json
  controls:
  - baseline
  - frequency
  contrasts:
  - - memory
    - baseline
    - brier
  - - memory
    - frequency
    - brier
  candidate_gate: Both registered contrasts must pass all fixed phase/effect/stability/multiplicity gates
inference:
  blocks:
  - 21
  - 63
  - 126
  hac_lags: 126
  minimum_phase_observations: 127
  minimum_phase_per_class: 30
  minimum_slice_per_class: 15
  bootstrap_draws: 99999
  seed: 20260919
  inference_scale: 1.0
  seed_rule: seed+phase_code*10000+block; development0,evaluation1
  p_phase: Maximum two-sided centered-null circular-block bootstrap p and Bartlett HAC126 p
  p_hypothesis: Maximum development/evaluation p
  multiplicity: Holm2 at.05/(13*14), separately cumulativeHolm119 at.05
  gate: Bothphase absolute Brier decrease>=.0005 against BOTHcontrols; negative differences in bothfixed evaluation
    slices; waveHolm<.05/182,cumulativeHolm<.05
  support: Atleast50events/50nonevents perfit;30/class perphase;15/class perfixed evaluationslice; any insufficient
    support aborts wholefamily, no droppedfolds
  power: Nominal HAC80percent MDE diagnostic only, divided by fixed .0005 effect; no postscore power gate or equivalence
    claim
  resolution: Minimum p1/100000 below one tenth strictest two-comparison raw wave cutoff1/7280
  failure_rule: All2new hypotheses UNEVALUABLEp1 after any admission/measurement/support/fit/scoring/verification/publication
    failure; preserve all diagnostics and old artifacts; no outcome-dependent repair
  calibration: 'Descriptive calibration in the large only: perphase/model n, observed binary frequency, mean issued
    probability, probability-minus-frequency gap and Brier. No bins, calibration fitting, hypothesis, selection
    or promotion gate; not a full conditional calibration claim.'
verification:
  coefficient_relative_tolerance: 1.0e-07
  coefficient_absolute_tolerance: 1.0e-06
  independent_probability_relative_tolerance: 1.0e-07
  independent_probability_absolute_tolerance: 1.0e-06
  saved_probability_relative_tolerance: 1.0e-10
  saved_probability_absolute_tolerance: 1.0e-12
  objective_relative_tolerance: 1.0e-10
  objective_absolute_tolerance: 1.0e-12
  saved_gradient_tolerance: 1.0e-08
  gradient_roundoff_allowance: 1.0e-12
  independent_gradient_tolerance: 1.0e-10
  inference_relative_tolerance: 1.0e-09
  inference_absolute_tolerance: 1.0e-14
  reconstruction: Independent raw source, feature, sign/tie/rolling/maturity/support/transformation/convex objective,
    fit, probability, score, fourphase inference and complete119family ledger; no new producer import
  independent_optimizer:
    baseline_method: trust-exact
    baseline_initialization: all_zero
    baseline_gradient_target: 1.0e-10
    baseline_maximum_iterations: 500
    memory_method: brentq
    memory_bracket: symmetric plus/minus (mean(abs(centered_memory))+1)/0.02
    memory_absolute_tolerance: 1.0e-12
    memory_relative_tolerance: 1.0e-14
    memory_maximum_iterations: 200
    accepted_gradient_tolerance: 1.0001e-08
    acceptance: Require finite objectives, parameters and probabilities plus independently recomputed full gradient
      within the accepted tolerance. Record optimizer status; a tighter target being unmet does not override the
      declared accepted gradient criterion. Compare independent coefficients/probabilities at their separate fixed
      tolerances; reconstruct primary scores from stricter saved-coefficient replay.
    arithmetic: Independently evaluate stable signed-label logaddexp NLL, signed logistic score and expit(eta)*expit(-eta)
      curvature. Finite probability endpoints are valid; no probability clipping or optimization retries.
