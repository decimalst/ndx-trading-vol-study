  target: log(raw_close[t+21]/raw_close[t]); target end and availability at observed session t+21 close
  fit_schedule: First common-feature-complete origin of each month within origin/phase fences before query-label
    filtering; all four arms use identical mature training and full application origins
  training_availability: Earlier common-complete origins with finite labels available no later than previous
    observed session of fit; whole-trial failure below1000
  missing: Keep full reference calendar; exact252-close windows; no fill/compress/window shortening; no
    arithmetic-fault row dropping
peak:
  window_closes: 252
  return_intervals: 251
  cutoff: Previous observed SPX session k; literal positions k-251..k
  tie: Latest exact stored float64 close equal to window maximum P
  age: (k-latest_peak_position)/251; fixed scale one
  depth: Stable log ratio P/C[k]
  depth_square: Single multiplication of returned depth
  window_return: Stable log ratio C[k]/C[k-251]
  log_ratio: Positive finite float64 x,y; exact equality returns0; frexp mantissas/exponents mx,ex,my,ey,
    d=ex-ey; abs(d)<=1 uses log1p((ldexp(mx,d)-my)/my), otherwise fsum(log(mx/my),d*log(2)); finite result
    must have correct nonzero sign for unequal prices
  arithmetic: No overflow or nonzero-product underflow in required operations; incomplete source windows
    remain missing; arithmetic invalidity on otherwise observed inputs aborts trial
  interpretation: Age of latest maximum inside rolling252-close window, not all-time-high or recovery
    duration
model:
  ridge: 0.01
  baseline_slopes: 16
  depth_slopes: 19
  curvature: I_square and R_square centered on exact common training rows only
  scaling: Population mean/std on common training rows; all declared nuisance scales finite and >1e-12;
    no unused hinge and no feature deletion
  intercept: Unpenalized common training target mean
  objective: Mean squared error plus .01 squared norm of standardized slopes; separately refit baseline
    and depth
  scalar: Freeze current monthly depth fit; residuals are y minus its in-sample training predictions;
    age centered by math.fsum/n, exactconstant uses first age; beta=mean(centered_age*residual)/(mean(centered_age^2)+.01)
  application: depth_prediction+beta*(query_age-training_age_mean); no additional intercept, no joint
    refit, no age standardization
  constant: Exactconstant training age or exactlyzero numerator yields beta0 and exact copy of depth query
    predictions, even if query age differs
  attribution: Sequential correction can retune ridge shrinkage inside nuisance span; no Frisch-Waugh
    residualization or orthogonality claim
  fallback: None; any source/support/model/numerical/inference/publication failure aborts all three hypotheses
    at p1
