    zero; unique optimum follows curvature>=.02
  arithmetic: Strictrealfinite designs/parameters/states/predictions; positivey/mean/scaledtargets/ratio/forecast;
    reject unsupported nonzeroproduct,quotient,exp underflow. Tentative invalid objectives may be rejected
    within the fixed Armijo schedule; accepted iterates and published forecasts cannot be repaired/clipped/restarted
scoring:
  loss: proper_variance
  formula: log(h)+y/h
  effect_threshold_absolute: 0.005
  paired_difference: d=(hA-hB)/max(hA,hB); gap=logratio-d*(y/min(hA,hB)). For abs(d)<=.5 logratio=-log1p(-d)
    ifd>=0 else log1p(d); otherwise log(hA)-log(hB)
  arithmetic: First validate every positive real input and finite individual score, reject unsupported
    quotient/product underflow. Coherence allowance64 times sum of unit(x) for loghA,y/hA,loghB,y/hB,stablegap,directgap;
    unit=max(eps*abs(x),abs(x)-nextafter(abs(x),0)), no unit floor
  effect_reference: Absolute mean natural-log proper-score decrease.005 bothphases, not percentage of
    potentiallynegative rawscore or profit
