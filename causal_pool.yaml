  required_status: VERIFIED
  admission: Reconstruct complete original VERIFIED record through frozen read-only functions; anchor historical
    inventory by its exact original manifest hash, never by enumerating the expanded current source tree; pin
    all previous code, inputs, preserved and output/report artifacts
target:
  event: Both next observed SPX-session raw log(close/open) returns strictly positive, or both strictly negative
  zero: Either or both exactly zero gives class0; complement includes opposite directions and ties
  missing: Any missing return gives unknown, never class0; reject infinity or invalid observed source
  sign_arithmetic: Direct comparisons, never multiplication of returns or epsilon sign threshold
  positive_rescaling: Within-session positive price unit changes preserve each raw return; no total-return
    or executable auction equivalence
  fit_schedule: Monthly first feature-complete origin before future query-label filtering; expanding training
    labels mature by prior SPX close; retain unscored applications and folds
source_contract:
  reference_calendar: Exact full bounded SPX reference calendar from frozen wave13 features; no compressed
    dates or new source acquisition
  source_and_measurement: All frozen wave13 raw-source, whole-measurement and feature/target gates remain enforced
    by complete read-only independent replay
  immutable_read: Decode each admitted parquet/json input from a single hash-checked byte snapshot; final rehash
    all pins; no previous file writes
  limitations: Archival QQQ ETF versus SPX price index, vendor revisions and unsynchronized opens, unverified
    historical publication latency and back-calculated early VIX9D remain; no new untouched validation
pooling:
  half_life_sessions: 63
  decay: 2**(-1/63)
  baseline_weight: 0.5
  recent_weight: 0.5
  baseline: Exact original issued baseline probability on every original scored origin; no refit, memory-arm
    substitution or reconstructed in-sample predictions
  seed: At first original feature-complete monthly application origin preceding-session cutoff k0, S=f0,W=1;
    f0 exact original first fit frequency on its eligible mature training subset
  seed_provenance: Record first fit train_last_available separately from state cutoff k0; excluded old labels
    intentionally absent; never refeed any target available<=k0
  update: 'Every subsequent full reference session k: S=delta*S,W=delta*W, then for its unique finite binary
    target add (1-delta)*y to S and (1-delta) to W; advance only through previous-session cutoff of prediction'
  labels: Full immutable target table, including labels whose original origin was unscored or feature-incomplete;
    require exact next-reference-session target_end=available_date, duplicate or misaligned availability invalid
  missing: Decay numerator and mass on every reference session; missing paired return adds nothing, never class0;
    zero raw return remains valid nonevent; no compressing observations
  continuity: Single initialization and no resets across phases, feature gaps, all-unscored months or fixed
    evaluation slices; no burn-in or scored-origin deletion
  outputs: For every original application save state cutoff, latest included label availability, cumulative
    post-seed observation update count, S,W,q and original fit identity. Only original scored origins receive
    three probability rows; unscored applications have state audit only
  arithmetic: 'IEEE float64 in fixed operation order: delta*S and delta*W; (1-delta)*y; additions; q=S/W; separate
    0.5*p and 0.5*q products then sum. All state finite,0<=S<=W,W>0,probabilities in[0,1]. Reject unsupported
    nonzero products/divisions underflowing tozero; allow nonzero subnormals and exactzero outcomes; no clipping,
    reset, omission or alternative memory'
scoring:
  loss: brier
  effect_threshold_absolute: 0.0005
  paired_difference: (p_candidate-p_control)*((p_candidate-y)+(p_control-y)), after finite individual squared
    loss validation
  arithmetic: Binary finite y and finite probabilities in[0,1]; loss in[0,1]; exactzero errors valid; nonzero
    squares/products underflowing tozero reject; coherence64epsilon/downwardULP no arbitrary absolute floor
  functional: Conditional strict-agreement probability; expected Brier pi(1-pi)+(p-pi)^2; bounded loss needs
    no return fourth moments
  effect_reference: Absolute squared-probability error decrease .0005 bothphases; fixed statistical reference,
    not profit or direct probability-point improvement
