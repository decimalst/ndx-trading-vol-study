  minimum_phase_per_class: 30
  minimum_slice_per_class: 15
  bootstrap_draws: 99999
  seed: 20260920
  inference_scale: 1.0
  seed_rule: seed+phase_code*10000+block; development0,evaluation1
  p_phase: Maximum two-sided centered-null circular-block bootstrap p and Bartlett HAC126 p
  p_hypothesis: Maximum development/evaluation p
  multiplicity: Holm2 at.05/(14*15), separately cumulativeHolm121 at.05
  gate: Bothphase absolute Brier decrease>=.0005 against BOTHcontrols; negative differences in bothfixed evaluation
    slices; waveHolm<.05/210,cumulativeHolm<.05
  support: Original fits retain at least50events/50nonevents;30/class perphase;15/class perfixed evaluationslice;
    any insufficient support aborts wholefamily; no droppedfolds
  power: Nominal HAC80percent MDE diagnostic only, divided by fixed .0005 effect; no postscore power gate or
    equivalence claim
  resolution: Minimum p1/100000 below one tenth strictest two-comparison raw wave cutoff1/8400
  failure_rule: All2new hypotheses UNEVALUABLEp1 after any admission/measurement/support/fit/scoring/verification/publication
    failure; preserve all diagnostics and old artifacts; no outcome-dependent repair
  calibration: 'Descriptive calibration in the large only: perphase/model n, observed binary frequency, mean
    issued probability, probability-minus-frequency gap and Brier. No bins, calibration fitting, hypothesis,
    selection or promotion gate; not a full conditional calibration claim.'
verification:
  state_relative_roundoff_multiplier: 64
  state_roundoff: At k full reference sessions after k0, abs(actual-explicit)<=64*(k+1)*max(eps*abs(explicit),abs(explicit)-nextafter(abs(explicit),0));
    exactzero and sign masks, strict state/probability domain first
  independent_state: Explicit compensated sum of seed*delta**k and observed (1-delta)*delta**age weights; denominator
    seed mass delta**k plus same weights; do not call producer recurrence
  saved_replay: Exact float64 bits for q from saved S/W, pooled from two separate half products, preserved
    baseline and all Brier losses; no tolerance permitting domain violation
  inference_relative_tolerance: 1.0e-09
  inference_absolute_tolerance: 1.0e-14
  reconstruction: Complete frozen upstream proof; independent application and scored cohorts, every state/probability/primitive
    Brier/difference, four phase analyses, six calibration rows, complete121family ledger, immutable output
    snapshots and final pin rehash
