  their later mature outcomes
model:
  candidate: calibrated
  controls:
  - baseline
  - recent_frequency
  new_baseline_fits: 0
  half_life_sessions: 63
  decay: 2**(-1/63)
  ridge: 0.01
  objective: sum_j w_j*logaddexp(0,(1-2*y_j)*(eta_j+a))+.01*a*a
  weight: (1-delta)*delta**(cutoff_reference_position-label_available_reference_position); no renormalization
  seed: empty at first original application prior-session cutoff; no fitted-probability seeding or labels
    available at or before seed
  logit: replay original saved monthly transformations and coefficients on original application features;
    require saved application probability replay; never invert rounded probabilities
  history: only genuinely issued baseline applications with known binary outcome available by cutoff;
    cache all original applications independent of future label mask
  clock: full frozen reference calendar; feature gaps and unknown labels age weights; no phase resets
    or warmup deletion
  controls_preserved: retain original recent-frequency broader known-label stream and all original baseline/frequency
    probabilities and training metadata
  derivative: sum w*expit(eta+a) for y0 or -w*expit(-eta-a) for y1, plus .02*a; stable signed residual
    is not rounded saved p minus y
  producer:
    method: brentq
    bracket: plus/minus(sum(weights)+1)/.02
    xtol: 1.0e-12
    rtol: 1.0e-14
    maxiter: 200
    gradient_tolerance: 1.0e-08
    empty: canonical zero
    balanced: exact computed g(0)==0 may return zero
    fallback: none
  arithmetic: finite float64 logits, weights, signed softplus losses, stable signed residuals, gradients,
    objective and probabilities; signed softplus and signed residual for finite logits must remain nonzero;
    reject nonzero multiplication or division underflow; expit forecast endpoints allowed; never silently
    delete tiny records; scalar reductions use math.fsum
  arrival_categories: 'mutually exclusive precedence: no original issuance NO_ISSUED_FORECAST; issued
    missing label UNKNOWN_LABEL; otherwise ADMITTED'
  probability: If a==0 retain original saved baseline probability after mandatory strict expit(original_eta)
    replay; otherwise expit(replayed_eta+a). Fixed identity branch preserves exact nesting; no clipping
    or solver fallback.
verification:
  scalar:
    method: bisect
    bracket: plus/minus(sum(weights)+1)/.02
    xtol: 1.0e-12
    rtol: 1.0e-14
    maxiter: 200
    full_gradient_tolerance: 1.0001e-08
    fallback: none
    empty: canonical zero
  coefficient_rtol: 1.0e-07
  coefficient_atol: 1.0e-06
  saved_replay_rtol: 1.0e-10
  saved_replay_atol: 1.0e-12
  prediction_rtol: 1.0e-10
  prediction_atol: 1.0e-12
  inference_relative_tolerance: 1.0e-09
  inference_absolute_tolerance: 1.0e-14
  weight_roundoff_multiplier: 64
  independent_state: explicit ages on full reference calendar and compensated sums; strict domains and
