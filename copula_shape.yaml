shape:
  family: Sinh-arcsinh correction of Gaussianized PITs after the inherited train-only affine correction.
  formula: w=Phi^-1(T8(z)); x=(w-a)/b; v=sinh(delta*asinh(x)-epsilon); Fnew=Phi(v).
  density: log fnew=log f0+log phi(v)-log phi(w)+log(delta)-log(b)+log cosh(delta*asinh(x)-epsilon)-0.5log(1+x*x).
  fitting: Preserve train-only a,b; minimize convex mean normal-score negative log likelihood in epsilon,delta. Fixed L-BFGS-B plus projected Newton polishing, no multistart or validation selection.
  epsilon_bounds: [-0.75, 0.75]
  delta_bounds: [0.75, 2.0]
  convex_box_gap: 0.0000001
  dependence: Same fixed t8 and Gaussian families, rho bounds ±.995, old independent numerical global certificates.
  tail_limit: A proper normalized log-return density need not have finite moments. Do not infer arithmetic-return means, variances, Kelly fractions or unbounded-loss ES. Bounded vertical-spread expiration payoffs remain integrable.
