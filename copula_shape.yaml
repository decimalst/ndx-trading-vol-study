spreads:
  purpose: Test expiration-liability prediction and joint-loss warnings for hypothetical normalized spreads. Actual option profits, fills, margin calls and tradability cannot be established without historical option contracts and quotes.
  structures: [put, call, condor]
  distance_primary: 0.02
  distances: [0.01, 0.02, 0.03]
  width: 0.01
  strike_rule: Underlying opening level normalized to1; short puts1-distance, long puts1-distance-width; short calls1+distance,long calls1+distance+width. Condor has both wings. Fixed distance set independently of labels.
  horizon: Hypothetical same-session expiration at the observed close. No assertion that these contracts or expiries existed each historical day, no entry-price or settlement-price substitution.
  portfolio: Equal gross maximum-liability allocation to QQQ and SPX; individual payoff divided by width lies in[0,1], portfolio payoff is their average.
  models: [orig_gaussian, orig_t8, cal_gaussian, cal_t8, shape_gaussian, shape_t8]
  integration:
    method: Two fixed scrambled Sobol draws of2^14 three-dimensional points; shared underlying normal and chi-square draws across all cells and dates; second scramble quantifies numerical sensitivity, never chooses a model.
    powers: 14
    seeds: [20260913, 20260914]
    quantile: 0.975
    marginal_mean: Nested48/96-point Gauss-Legendre integration of marginal CDF across each width. If disagreement exceeds1e-8, adaptive quadrature with epsabs1e-11/epsrel1e-10 and error at most1e-8. Shared identically within a marginal system. This prefit numerical repair was required by a synthetic narrow-density example, before market evaluation.
    maximum_probability_difference: 0.005
    maximum_mean_or_es_difference: 0.03
    threshold: Use average probability across both scrambles; report decisions that straddle the0.10 gate across scrambles as numerical ambiguity. No adaptive sample selection or rerun.
  rule: Sell only when predicted probability of either short strike being breached is at most0.10. Other risks are reported, not secondary selection gates.
  maximum_liability_fraction: 0.02
  risk_allocation: Each asset reserves1% equity for its entire spread width before credit, so at most2% gross expiration liability. No Kelly or loss-recovery sizing.
  controls: Always sell the identical portfolio; all six fixed probability filters. No best-performing model or strike-distance selection.
  scenario_credits: [0.05, 0.10, 0.20]
  scenario_roundtrip_cost: 0.02
  scenario_units: Credits and costs as fractions of spread width. Hypothetical constant credits are not historical option prices and do not prove implementable profits.
  metrics: Coverage, realized short-strike breaches and full-width losses, predicted versus observed loss, Brier scores, portfolio ES exceptions, break-even credit, avoided liability and forgone assumed credit, scenario net returns and drawdowns; report every specified cell.
  inference: Descriptive safety and scenario economics only, no extra significance tests or promotion; disclose all cases and no winner chosen.
  path_limits: Expiration loss only. No stops, intraday mark-to-market, assignment, early exercise, fees actually paid, option bid/ask, discrete strike availability, funding, broker margin, roll or executable-contract assumptions.
